[project]
name = "homestock-mcp"
version = "0.1.0"
description = "Local-first household inventory. Reads your shopping receipts, tells you what you have and what to buy. One file on your computer, zero cloud."
readme = "README.md"
license = { text = "FSL-1.1-MIT" }
authors = [{ name = "Thomas Peel" }]
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2"]
keywords = ["mcp", "inventory", "household", "pantry", "groceries", "local-first", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/Thomaspeel6/HomeStock"

[project.scripts]
homestock = "homestock.server:main"        # MCP server (stdio) — for AI clients
homestock-ui = "homestock.ui:main"         # pantry window — for people

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homestock"]

# Served over MCP as prompts and resources, so they must travel with the
# package rather than only existing in a git checkout.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "homestock/prompts"
"recipes" = "homestock/recipes"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
filterwarnings = [
  # Upstream noise: pydantic-settings, via mcp, warns about an unresolved
  # forward reference in its own model. Nothing here can fix it, and it prints
  # on the first command the README asks a newcomer to run, where it reads as
  # "this project is broken".
  "ignore::pydantic_settings.exceptions.IncompleteFieldDefinitionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # long lines are usually a docstring explaining a decision
  "SIM108",  # ternaries are not always clearer than an if
]

[tool.ruff.lint.per-file-ignores]
# Tests unwrap FastMCP tool objects with a one-line lambda helper on purpose.
"tests/*" = ["E731"]
"scripts/*" = ["E731"]
